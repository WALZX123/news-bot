<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 新闻机器人</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #1a1a2e 100%);
      position: relative;
      overflow-x: hidden;
    }
    /* Ambient background dots */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(79,110,247,0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(124,58,237,0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16,185,129,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-container { position: relative; z-index: 1; }

    .login-header .brand-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f6ef7, #7c3aed);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(79,110,247,0.3);
    }
    .login-header h3 {
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .login-header p {
      color: rgba(255,255,255,0.55);
      font-size: 0.88rem;
    }

    .login-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }
    .login-card .form-label {
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .login-card .form-control {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .login-card .form-control:focus {
      border-color: #4f6ef7;
      box-shadow: 0 0 0 3px rgba(79,110,247,0.2);
      background: rgba(255,255,255,0.1);
    }
    .login-card .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .login-card .input-group-text {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-right: none;
      color: rgba(255,255,255,0.4);
      border-radius: var(--radius-sm);
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .login-card .input-group .form-control {
      border-left: none;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }
    .btn-login {
      width: 100%;
      padding: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #4f6ef7, #6366f1);
      border: none;
      color: #fff;
      transition: all var(--transition-fast);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(79,110,247,0.35);
    }
    .login-footer {
      color: rgba(255,255,255,0.3);
      font-size: 0.7rem;
      text-align: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-md-4 col-lg-3">
      <!-- Header -->
      <div class="text-center mb-4 login-header">
        <div class="brand-icon"><i class="bi bi-newspaper"></i></div>
        <h3>新闻机器人</h3>
        <p>管理面板</p>
      </div>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 border-0 shadow-sm" role="alert" style="font-size:0.85rem;">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
      {% endwith %}

      <!-- Login card -->
      <div class="login-card p-4">
        {% if setup_error %}<div class="alert alert-warning">{{ setup_error }}</div>{% endif %}
        <form method="POST" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="mb-3">
            <label class="form-label">密码</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="请输入管理密码" autofocus required>
            </div>
          </div>
          <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-1"></i>登录
          </button>
        </form>
      </div>

      <div class="login-footer">
        News Bot v1.0 · Flask + Bootstrap 5
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
