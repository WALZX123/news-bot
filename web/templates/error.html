{% extends "base.html" %}
{% block title %}{{ code }} - 新闻机器人{% endblock %}
{% block page_title %}{% if session.get("authenticated") %}<i class="bi bi-exclamation-triangle"></i> 错误{% endif %}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="text-secondary mb-3" style="font-size:5rem; font-weight:800; letter-spacing:-2px; opacity:0.2;">{{ code }}</div>
  <p class="lead fw-medium">{{ message }}</p>
  {% if session.get("authenticated") %}
  <a href="/" class="btn btn-primary rounded-pill px-4"><i class="bi bi-house me-1"></i>返回仪表盘</a>
  {% else %}
  <a href="/login" class="btn btn-primary rounded-pill px-4">返回登录</a>
  {% endif %}
</div>
{% endblock %}
