# Copy to a private config.yaml. Keep credentials out of version control.
# Environment overrides: MYSQL_HOST/PORT/USER/PASSWORD/DATABASE,
# DINGTALK_WEBHOOK_URL/SECRET, AI_API_KEY/BASE_URL/MODEL, WEB_PASSWORD.
mysql:
  host: localhost
  port: 3306
  user: news_bot
  password: ""
  database: news_bot
  charset: utf8mb4
dingtalk:
  webhook_url: ""
  secret: ""
ai:
  api_key: ""
  api_key_ref: ""
  base_url: ""
  model: deepseek-v4-pro
  max_tokens: 8192
  timeout_seconds: 60
  input_max_chars: 80000
  max_calls: 12
  total_timeout_seconds: 180
  # Conservative UTF-8 byte-based reservations, not billed token measurements.
  total_token_budget: 262144
# Empty list disables collection; pending work and reports can still run.
rss_sources: []
fetch_interval_minutes: 120
# 0 removes the additional send-count limit; candidate/model budgets still apply.
max_news_per_run: 50
max_candidates_per_run: 100
request_timeout: 15
fetch_task_timeout: 120
rss_max_response_bytes: 2097152
max_news_age_hours: 72
# Exact hostnames or IPs only; no wildcards, ports or subdomain inheritance.
# RSS connects directly with checked IPs and does not use environment proxies.
allow_private_rss_hosts: []
push_time_window:
  start: 0
  end: 24
incremental_mode: false
ai_interests: ""
auto_summarize: true
summary_limit: 16
keywords:
  include: []
  require: []
  exclude: []
  fuzzy_threshold: 70
source_weights:
  tier1: []
  tier2: []
reports:
  weekly: true
  monthly: true
  quarterly: true
  yearly: true
retention_days: 400
log_level: INFO
log_file: news_bot.log
# Login is disabled until WEB_PASSWORD or this private password hash is set.
web_password: ""
