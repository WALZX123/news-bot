name: offline-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      # Official release commits verified on 2026-11-17; updates are deliberate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            workbench/backend/requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r workbench/backend/requirements.lock
      - run: python -m pip check
      - run: python -B tools/check_project.py
      - run: python -B -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -B -m unittest discover -s workbench/tests -v
      - if: matrix.python-version == '3.13'
        working-directory: workbench
        run: npm ci
      - if: matrix.python-version == '3.13'
        working-directory: workbench
        run: npm run build
